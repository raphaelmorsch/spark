schemaVersion: 2.2.0

metadata:
  name: ai-code-assistant
  displayName: AI Code Assistant
  description: >
    Workspace com OpenCode e Python para Spark no OpenShift AI.

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "1"
      cpuLimit: "4"

      mountSources: true

      env:
        - name: PATH
          value: /home/user/.local/bin:/usr/local/bin:/usr/bin:/bin

        - name: PYTHONPATH
          value: /projects/python-packages

        - name: PYTHONUNBUFFERED
          value: "1"

        - name: SPARK_NAMESPACE
          value: redhat-ods-applications

        - name: SPARK_REMOTE
          value: sc://spark-connect-server.redhat-ods-applications.svc.cluster.local:15002

commands:
  - id: initialize-workspace
    exec:
      component: tools
      label: Initialize workspace
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        bash <<'BASH'
        export PATH="$HOME/.local/bin:$PATH"

        LOG=/projects/workspace-bootstrap.log

        (
          set -eu

          echo "========================================"
          echo "Preparando workspace: $(date)"
          echo "Diretório: $PWD"
          echo "========================================"

          echo "Preparando Python..."
          bash scripts/bootstrap-spark-python.sh

          echo "Preparando OpenCode..."
          bash scripts/bootstrap-ai-assistant.sh

          echo "PREPARACAO CONCLUIDA"
        ) > "$LOG" 2>&1

        RESULT=$?

        cat "$LOG"

        if [ "$RESULT" -ne 0 ]; then
          echo
          echo "ATENCAO: a preparação falhou."
          echo "O workspace será aberto para diagnóstico."
          echo "Consulte: /projects/workspace-bootstrap.log"
        fi

        exit 0
        BASH

  - id: test-spark-connect
    exec:
      component: tools
      label: Test Spark Connect
      commandLine: |
        /usr/bin/python3.11 <<'PY'
        import os
        from pyspark.sql import SparkSession

        spark = (
            SparkSession.builder
            .remote(os.environ["SPARK_REMOTE"])
            .getOrCreate()
        )

        try:
            print("Spark Version:", spark.version)
            print("Count:", spark.range(1000).count())
        finally:
            spark.stop()
        PY
      group:
        kind: test

  - id: list-spark-applications
    exec:
      component: tools
      label: List Spark Applications
      commandLine: |
        oc get sparkapplications -n repositorio
      group:
        kind: run

  - id: test-ai-connection
    exec:
      component: tools
      label: Test AI Connection
      commandLine: |
        /usr/bin/python3.11 <<'PY'
        import json
        import os
        import urllib.request

        base_url = os.environ.get("AI_BASE_URL", "").rstrip("/")
        model = os.environ.get("AI_MODEL", "")
        api_key = os.environ.get("AI_API_KEY", "")

        if not base_url or not model:
            raise SystemExit("Configure AI_BASE_URL e AI_MODEL.")

        headers = {"Content-Type": "application/json"}

        if api_key:
            headers["Authorization"] = f"Bearer {api_key}"

        payload = {
            "model": model,
            "messages": [
                {
                    "role": "user",
                    "content": "Reply exactly with: AI connection OK",
                }
            ],
            "stream": False,
            "max_tokens": 32,
        }

        request = urllib.request.Request(
            f"{base_url}/chat/completions",
            data=json.dumps(payload).encode("utf-8"),
            headers=headers,
            method="POST",
        )

        with urllib.request.urlopen(request, timeout=120) as response:
            result = json.load(response)

        print(json.dumps(result, indent=2, ensure_ascii=False))
        PY
      group:
        kind: test

events:
  postStart:
    - initialize-workspace