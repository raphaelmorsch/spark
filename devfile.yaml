schemaVersion: 2.2.0

metadata:
  name: ai-code-assistant
  displayName: AI Code Assistant
  description: >
    OpenShift Dev Spaces workspace prepared to consume
    OpenAI-compatible models such as OpenShift AI vLLM.

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "1"
      cpuLimit: "4"

      mountSources: true
      
      env:
        - name: SPARK_NAMESPACE
          value: redhat-ods-applications

        - name: SPARK_REMOTE
          value: sc://spark-connect-server.redhat-ods-applications.svc.cluster.local:15002

        - name: VIRTUAL_ENV
          value: /projects/.venv-spark

        - name: PATH
          value: /projects/.venv-spark/bin:/usr/local/bin:/usr/bin:/bin

        - name: PYTHONUNBUFFERED
          value: "1"      

commands:
  # ==========================================================
  # Instalação automática das dependências
  # ==========================================================

  - id: bootstrap-spark-python
    exec:
      component: tools
      label: Prepare Spark Python
      commandLine: |
        set -eu

        /usr/bin/python3.11 - <<'PY'
        import fcntl
        import json
        import os
        import subprocess
        import sys
        import tempfile
        from pathlib import Path

        TARGET = Path("/projects/python-packages")
        MARKER = TARGET / "setup-completo.json"

        REDHAT_INDEX = (
            "https://packages.redhat.com/api/pypi/"
            "public-rhai/rhoai/3.5/cpu-ubi9/simple/"
        )
        PYPI_INDEX = "https://pypi.org/simple"

        CONFIG = {
            "setup_version": 1,
            "python": list(sys.version_info[:2]),
            "kubeflow": "0.3.0+rhaiv.3",
            "pyspark": "4.0.1",
            "pyarrow": "24.0.0",
        }

        VALIDATE = """
        from kubeflow.spark import SparkClient
        from kubeflow.common.types import KubernetesBackendConfig
        from kubeflow.spark.types.types import Driver
        import pyspark
        import pyarrow
        import pandas
        import grpc
        import zstandard
        import ipykernel
        import matplotlib

        assert pyspark.__version__ == "4.0.1"
        assert pyarrow.__version__ == "24.0.0"
        print("Dependencias Spark validadas.")
        """

        def run(*args, env=None):
            subprocess.run(
                [str(arg) for arg in args],
                check=True,
                env=env,
            )

        # Nao usar pacotes de uma instalacao incompleta durante o pip.
        install_env = os.environ.copy()
        install_env.pop("PYTHONPATH", None)

        runtime_env = os.environ.copy()
        runtime_env["PYTHONPATH"] = str(TARGET)

        Path("/projects").mkdir(parents=True, exist_ok=True)

        with open("/projects/.spark-python-setup.lock", "w") as lock:
            fcntl.flock(lock, fcntl.LOCK_EX)

            if MARKER.exists():
                saved = json.loads(MARKER.read_text())

                if saved != CONFIG:
                    raise RuntimeError(
                        "A configuracao Python mudou. "
                        "O administrador deve preparar outra versao do ambiente."
                    )

                run(sys.executable, "-c", VALIDATE, env=runtime_env)
                print("Ambiente reutilizado. Nenhum pip install executado.")

            else:
                TARGET.mkdir(parents=True, exist_ok=True)

                print("Primeira inicializacao: preparando bibliotecas...")

                with tempfile.TemporaryDirectory(
                    prefix="spark-wheels-",
                    dir="/projects",
                ) as temp_dir:
                    temp = Path(temp_dir)

                    # Obtem especificamente o wheel upstream do PyArrow.
                    run(
                        sys.executable, "-m", "pip", "download",
                        "--index-url", PYPI_INDEX,
                        "--only-binary=:all:",
                        "--no-deps",
                        "--dest", temp,
                        "pyarrow==24.0.0",
                        env=install_env,
                    )

                    arrow_wheel = next(temp.glob("pyarrow-*.whl"))

                    # O wheel explicito evita selecionar outro build do PyArrow.
                    run(
                        sys.executable, "-m", "pip", "install",
                        "--target", TARGET,
                        "--upgrade",
                        "--index-url", REDHAT_INDEX,
                        "--extra-index-url", PYPI_INDEX,
                        arrow_wheel,
                        "kubeflow[spark]==0.3.0+rhaiv.3",
                        "pyspark-connect==4.0.1",
                        "zstandard",
                        "ipykernel",
                        "matplotlib",
                        env=install_env,
                    )

                run(sys.executable, "-c", VALIDATE, env=runtime_env)

                temporary_marker = MARKER.with_suffix(".tmp")
                temporary_marker.write_text(json.dumps(CONFIG, indent=2))
                temporary_marker.replace(MARKER)

                print("Preparacao concluida e registrada no PVC.")
        PY  
  
  - id: initialize-workspace
    composite:
      label: Initialize workspace
      parallel: false
      commands:
        - bootstrap-spark-python
        - bootstrap-ai-assistant  

  # ==========================================================
  # Testar conexão com Spark Connect
  # ==========================================================

  - id: test-spark-connect
    exec:
      component: tools
      label: Test Spark Connect
      commandLine: |
        python -c "
        import os
        from pyspark.sql import SparkSession

        spark = (
            SparkSession.builder
            .remote(os.environ['SPARK_REMOTE'])
            .getOrCreate()
        )

        print('Spark Version:', spark.version)
        print('Count:', spark.range(1000).count())

        spark.stop()
        "
      group:
        kind: test

  # ==========================================================
  # Consultar SparkApplications existentes
  # ==========================================================

  - id: list-spark-applications
    exec:
      component: tools
      label: List Spark Applications
      commandLine: |
        oc get sparkapplications -n repositorio
      group:
        kind: run


  - id: bootstrap-ai-assistant
    exec:
      label: Bootstrap AI Code Assistant
      component: tools
      commandLine: |
        set -u

        echo "============================================"
        echo " AI Code Assistant bootstrap"
        echo "============================================"

        echo "User: $(whoami)"
        echo "Home: $HOME"

        #
        # OpenCode
        #

        npm config set prefix "$HOME/.local"

        if ! command -v opencode >/dev/null 2>&1; then
          echo
          echo "Installing OpenCode 1.18.35..."

          if ! npm install -g opencode-ai@1.18.35; then
            echo
            echo "WARNING: OpenCode installation failed."
            echo "The workspace will still be started."
            exit 0
          fi
        fi

        echo
        echo "OpenCode:"
        command -v opencode
        opencode --version

        #
        # AI configuration
        #

        if [ -z "${AI_BASE_URL:-}" ]; then
          echo
          echo "WARNING: AI_BASE_URL is not configured."
          echo "OpenCode was installed, but no AI provider was configured."
          exit 0
        fi

        if [ -z "${AI_MODEL:-}" ]; then
          echo
          echo "WARNING: AI_MODEL is not configured."
          echo "OpenCode was installed, but no AI provider was configured."
          exit 0
        fi

        mkdir -p "$HOME/.config/opencode"

        node <<'NODE'
        const fs = require("fs");
        const path = require("path");

        function clean(value) {
          if (!value) return "";

          return value
            .trim()
            .replace(/^['"]+/, "")
            .replace(/['"]+$/, "");
        }

        const baseURL = clean(process.env.AI_BASE_URL)
          .replace(/\/+$/, "");

        const model = clean(process.env.AI_MODEL);

        const providerName =
          clean(process.env.AI_PROVIDER_NAME) ||
          "OpenShift AI";

        const apiKey =
          clean(process.env.AI_API_KEY);

        const options = {
          baseURL: "{env:AI_BASE_URL}"
        };

        if (apiKey) {
          options.apiKey = "{env:AI_API_KEY}";
        }

        const config = {
          "$schema": "https://opencode.ai/config.json",

          "model": `devspaces/${model}`,

          "provider": {
            "devspaces": {
              "npm": "@ai-sdk/openai-compatible",
              "name": providerName,
              "options": options,
              "models": {
                [model]: {
                  "name": model,
                  "limit": {
                    "context": 32768,
                    "output": 4096
                  }
                }
              }
            }
          }
        };

        const configPath = path.join(
          process.env.HOME,
          ".config",
          "opencode",
          "opencode.json"
        );

        fs.writeFileSync(
          configPath,
          JSON.stringify(config, null, 2)
        );

        console.log(`Generated ${configPath}`);
        console.log(`Provider : ${providerName}`);
        console.log(`Base URL : ${baseURL}`);
        console.log(`Model    : ${model}`);
        console.log(
          `API key  : ${apiKey ? "configured" : "not configured"}`
        );
        NODE

        echo
        echo "============================================"
        echo " AI Code Assistant ready"
        echo "============================================"
        echo
        echo "Provider: ${AI_PROVIDER_NAME:-OpenShift AI}"
        echo "Endpoint: ${AI_BASE_URL}"
        echo "Model:    ${AI_MODEL}"
        echo
        echo "Test with:"
        echo "  opencode run \"Reply exactly with: AI connection OK\""
        echo

        exit 0

  - id: test-ai-connection
    exec:
      label: Test AI Connection
      component: tools
      commandLine: |
        if [ -z "${AI_BASE_URL:-}" ] || [ -z "${AI_MODEL:-}" ]; then
          echo "AI_BASE_URL and AI_MODEL must be configured."
          exit 1
        fi

        AUTH_HEADER=""

        if [ -n "${AI_API_KEY:-}" ]; then
          AUTH_HEADER="Authorization: Bearer ${AI_API_KEY}"
        fi

        if [ -n "$AUTH_HEADER" ]; then
          curl -fsS \
            "${AI_BASE_URL%/}/chat/completions" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"${AI_MODEL}\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply exactly with: AI connection OK\"
                }
              ],
              \"stream\": false,
              \"max_tokens\": 32
            }" | python3 -m json.tool
        else
          curl -fsS \
            "${AI_BASE_URL%/}/chat/completions" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"${AI_MODEL}\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Reply exactly with: AI connection OK\"
                }
              ],
              \"stream\": false,
              \"max_tokens\": 32
            }" | python3 -m json.tool
        fi

events:
  postStart:
    - initialize-workspace
