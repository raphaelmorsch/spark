schemaVersion: 2.2.0

metadata:
  name: ai-code-assistant
  displayName: AI Code Assistant
  description: >
    Workspace com OpenCode e Python para Spark no OpenShift AI.

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "1"
      cpuLimit: "4"

      mountSources: true

      env:
        - name: PATH
          value: /home/user/.local/bin:/usr/local/bin:/usr/bin:/bin

        - name: PYTHONPATH
          value: /projects/python-packages

        - name: PYTHONUNBUFFERED
          value: "1"

        - name: SPARK_NAMESPACE
          value: redhat-ods-applications

        - name: SPARK_REMOTE
          value: sc://spark-connect-server.redhat-ods-applications.svc.cluster.local:15002

commands:
  - id: initialize-workspace
    exec:
      component: tools
      label: Initialize workspace
      workingDir: ${PROJECT_SOURCE}
      commandLine: |
        bash <<'BASH'
        export PATH="$HOME/.local/bin:$PATH"

        LOG=/projects/workspace-bootstrap.log

        (
          set -eu

          echo "========================================"
          echo "Preparando workspace: $(date)"
          echo "Diretório: $PWD"
          echo "========================================"

          echo "Preparando Python..."
          bash scripts/bootstrap-spark-python.sh

          echo "Preparando OpenCode..."
          bash scripts/bootstrap-ai-assistant.sh

          echo "PREPARACAO CONCLUIDA"
        ) > "$LOG" 2>&1

        RESULT=$?

        cat "$LOG"

        if [ "$RESULT" -ne 0 ]; then
          echo
          echo "ATENCAO: a preparação falhou."
          echo "O workspace será aberto para diagnóstico."
          echo "Consulte: /projects/workspace-bootstrap.log"
        fi

        exit 0
        BASH

  - id: test-spark-connect
    exec:
      component: tools
      label: Test Spark Connect
      commandLine: |
        /usr/bin/python3.11 <<'PY'
        import os
        from pyspark.sql import SparkSession

        spark = (
            SparkSession.builder
            .remote(os.environ["SPARK_REMOTE"])
            .getOrCreate()
        )

        try:
            print("Spark Version:", spark.version)
            print("Count:", spark.range(1000).count())
        finally:
            spark.stop()
        PY
      group:
        kind: test

  - id: list-spark-applications
    exec:
      component: tools
      label: List Spark Applications
      commandLine: |
        oc get sparkapplications -n repositorio
      group:
        kind: run

  - id: test-ai-connection
    exec:
      component: tools
      label: Test AI Connection
      commandLine: |
        /usr/bin/python3.11 <<'PY'
        import json
        import os
        import urllib.request

        base_url = os.environ.get("AI_BASE_URL", "").rstrip("/")
        model = os.environ.get("AI_MODEL", "")
        api_key = os.environ.get("AI_API_KEY", "")

        if not base_url or not model:
            raise SystemExit("Configure AI_BASE_URL e AI_MODEL.")

        headers = {"Content-Type": "application/json"}

        if api_key:
            headers["Authorization"] = f"Bearer {api_key}"

        payload = {
            "model": model,
            "messages": [
                {
                    "role": "user",
                    "content": "Reply exactly with: AI connection OK",
                }
            ],
            "stream": False,
            "max_tokens": 32,
        }

        request = urllib.request.Request(
            f"{base_url}/chat/completions",
            data=json.dumps(payload).encode("utf-8"),
            headers=headers,
            method="POST",
        )

        with urllib.request.urlopen(request, timeout=120) as response:
            result = json.load(response)

        print(json.dumps(result, indent=2, ensure_ascii=False))
        PY
      group:
        kind: test
        
  - id: grant-spark-connect-access
    exec:
      component: tools
      label: Configurar permissões Spark Connect
      commandLine: |
        set -eu

        WORKSPACE_NAMESPACE="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
        WORKSPACE_SERVICE_ACCOUNT="$(
          /usr/bin/python3.11 - <<'PY'
        import base64
        import json
        from pathlib import Path

        token = Path(
            "/var/run/secrets/kubernetes.io/serviceaccount/token"
        ).read_text().strip()

        payload = token.split(".")[1]
        payload += "=" * (-len(payload) % 4)

        claims = json.loads(base64.urlsafe_b64decode(payload))
        print(claims["sub"].split(":")[-1])
        PY
        )"

        TARGET_NAMESPACE="${SPARK_NAMESPACE:-redhat-ods-applications}"

        echo "Identidade usada pelo oc:"
        oc whoami

        echo "Concedendo acesso para:"
        echo "  Namespace: $WORKSPACE_NAMESPACE"
        echo "  ServiceAccount: $WORKSPACE_SERVICE_ACCOUNT"
        echo "  Destino Spark: $TARGET_NAMESPACE"

        cat <<EOF | oc apply -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: devspaces-spark-connect
          namespace: ${TARGET_NAMESPACE}
        rules:
          - apiGroups: ["sparkoperator.k8s.io"]
            resources: ["sparkconnects"]
            verbs: ["create", "get", "list", "watch", "delete"]
          - apiGroups: [""]
            resources: ["pods", "services"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["pods/log"]
            verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: spark-access-${WORKSPACE_SERVICE_ACCOUNT}
          namespace: ${TARGET_NAMESPACE}
        subjects:
          - kind: ServiceAccount
            name: ${WORKSPACE_SERVICE_ACCOUNT}
            namespace: ${WORKSPACE_NAMESPACE}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: devspaces-spark-connect
        EOF

        echo "Permissões configuradas."
      group:
        kind: run

  - id: configure-spark-network
    exec:
      component: tools
      label: Liberar acesso de rede ao Spark Connect
      commandLine: |
        set -eu

        WORKSPACE_NAMESPACE="$(
          cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
        )"

        TARGET_NAMESPACE="${SPARK_NAMESPACE:-redhat-ods-applications}"

        echo "Workspace: $WORKSPACE_NAMESPACE"
        echo "Spark: $TARGET_NAMESPACE"
        echo "Identidade usada:"
        oc whoami

        if [ "$(oc auth can-i create networkpolicies.networking.k8s.io \
          -n "$TARGET_NAMESPACE")" != "yes" ]; then
          echo "Sem permissão para criar NetworkPolicies em $TARGET_NAMESPACE."
          echo "Execute esta task com credenciais autorizadas."
          exit 1
        fi

        cat <<EOF | oc apply -f -
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-${WORKSPACE_NAMESPACE}-to-spark
          namespace: ${TARGET_NAMESPACE}
        spec:
          podSelector:
            matchLabels:
              spark-role: connect-server
              sparkoperator.k8s.io/launched-by-spark-operator: "true"
          policyTypes:
            - Ingress
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ${WORKSPACE_NAMESPACE}
              ports:
                - protocol: TCP
                  port: 15002
        EOF

        echo "Regra de acesso ao Spark Connect aplicada."
      group:
        kind: run  

events:
  postStart:
    - initialize-workspace
